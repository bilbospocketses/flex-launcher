name: Build
on:
  # Only master and release tags. A PR branch is built by `pull_request`;
  # without this filter every PR commit ran the whole build twice. Tag pushes
  # trigger the Release job, and GitHub does not apply paths-ignore to them.
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      [
        "**/**.md"
      ]

  # No paths-ignore on pull_request: `build-and-test` is a required status
  # check on master, and a docs-only PR that skipped this workflow would never
  # report it and could never merge.
  pull_request:
    branches:
      - master

  workflow_dispatch:

defaults:
  run:
    shell: bash
env:
  # vcpkg 2026.07.29. The previous pin (10b7a17) fetched getopt-win32 from a
  # GitHub archive that now 404s, which broke the Windows build.
  VCPKG_COMMITTISH: 9e593bb18ea69cc5095e012465dcd675a822ed0d

# Read-only by default; only the release job widens its token.
# All actions are pinned to commit SHAs (repo-level sha_pinning_required) with
# precise `# vX.Y.Z` comments so Dependabot can track them.
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  issues: none
  packages: read
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: read

jobs:
  build_windows:
    name: Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false

    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_GENERATOR: Visual Studio 17 2022
      VCPKG_TRIPLET: x64-windows-static

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: friendlyanon/setup-vcpkg@508a6e6b59a3c9d8dac926e1281d4471160d624b # v1.7.0
        with:
          committish: ${{env.VCPKG_COMMITTISH}}

      - name: Configure
        run: cmake -B build -G "${{env.CMAKE_GENERATOR}}" -D "CMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TRIPLET}}

      - name: Build
        run: cmake --build build --target package --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Unit tests
        run: ctest --test-dir build -C ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload package
        with:
          name: Windows build
          path: build/*.zip
          if-no-files-found: error

  build_linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # bookworm: bullseye is past end of life and its security mirror
          # now 404s on package downloads.
          - name: Debian
            docker_image: debian:bookworm
            package_ext: .deb

    container:
      image: ${{matrix.config.docker_image}}

    env:
      CMAKE_BUILD_TYPE: Release

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install dependencies"
        run: |
          if [[ "${{matrix.config.name}}" == "Debian" ]]; then
            apt update && apt install -y build-essential file git cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libinih-dev
          fi

      - name: Build
        run: |
          if [[ "${{matrix.config.name}}" == "Debian" ]]; then
            cmake -B build -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=/usr -DPACKAGE=DEB -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64
            cmake --build build --target package --config ${{env.CMAKE_BUILD_TYPE}}
            ctest --test-dir build --output-on-failure
          fi

      - name: Show package metadata
        run: dpkg-deb -f build/*.deb Package Version Architecture Maintainer Depends Homepage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload Package
        with:
          name: Debian build
          path: build/*${{matrix.config.package_ext}}
          if-no-files-found: error

  # Native arm64 runner with a Debian bookworm container. This replaces the
  # QEMU chroot into a 2022 Raspberry Pi OS (bullseye) image, which can no
  # longer install packages now that bullseye is past end of life. Raspberry
  # Pi OS is Debian-based and -DRPI=1 only changes the default config, so a
  # bookworm arm64 build is the equivalent package.
  build_rpi:
    name: Raspberry Pi
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false

    container:
      image: debian:bookworm

    env:
      CMAKE_BUILD_TYPE: Release

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: apt update && apt install -y build-essential file git cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libinih-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=/usr -DPACKAGE=DEB -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64 -DRPI=1
          cmake --build build --target package --config ${{env.CMAKE_BUILD_TYPE}}
          ctest --test-dir build --output-on-failure

      - name: Show package metadata
        run: dpkg-deb -f build/*.deb Package Version Architecture Maintainer Depends Homepage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload package
        with:
          name: Raspberry Pi build
          path: build/*.deb
          if-no-files-found: error

  # Arch Linux package built with makepkg from the PKGBUILD that
  # `cmake -DPACKAGE=ARCH` generates from config/PKGBUILD.in. The PKGBUILD
  # builds from a local source tarball, which `git archive` produces here.
  # makepkg refuses to run as root, so the build runs as an unprivileged user.
  build_arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake sdl2 sdl2_image sdl2_ttf libinih

      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -B build -DPACKAGE=ARCH
          git archive --format=tar.gz --prefix=streamflex/ -o build/streamflex.tar.gz HEAD
          useradd --create-home builder
          chown -R builder build
          su builder -c "cd '$GITHUB_WORKSPACE/build' && makepkg"

      - name: Show package metadata
        run: pacman -Qip build/*.pkg.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload package
        with:
          name: Arch Linux build
          path: build/*.pkg.tar.zst
          if-no-files-found: error

  # Generated library files are current, every file is listed, and brand art fits the shared outline
  library_check:
    name: Icon library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the icon library
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r branding/library/requirements.txt
          .venv/bin/python -m unittest discover -s branding/library -p "test_*.py" -v
          .venv/bin/python branding/library/check-library.py

  # Single required status check for the master branch ruleset. It passes only
  # when every platform build and the icon library check succeeded; `if: always()`
  # makes it report a failure (rather than being skipped) when a job fails or is cancelled.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [build_windows, build_linux, build_rpi, build_arch, library_check]
    if: always()
    steps:
      - name: Check platform builds
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Build results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A platform build did not succeed ($r)"
              exit 1
            fi
          done

  # Publishes the GitHub release when a v* tag is pushed. Every other run is a
  # dry run: it collects the packages and release notes exactly as a release
  # would, then skips attestation and publishing. v* tags cannot be deleted or
  # moved (tag ruleset), so a release job that breaks on the tag would cost a
  # version number; the dry run surfaces that on every PR instead.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # Sigstore OIDC token for build provenance
      attestations: write   # store the build provenance attestations
      actions: write        # dispatch the docs site rebuild
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The project version in CMakeLists.txt is what the packages are named
      # after. On a tag it must equal the tag; on a dry run it is the version
      # the next tag will carry.
      - name: Check packages
        run: |
          version=$(grep -m1 -oE '^[[:space:]]*VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          if [ -z "$version" ]; then echo "::error::No project VERSION found in CMakeLists.txt"; exit 1; fi
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = "true" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version in CMakeLists.txt"
            exit 1
          fi
          ls -l dist
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected 4 packages (Windows, Debian, Raspberry Pi, Arch), found $count"
            exit 1
          fi
          for f in dist/*; do
            case "$(basename "$f")" in
              *"$version"*) ;;
              *) echo "::error::$f does not carry project version $version"; exit 1 ;;
            esac
          done

      # Release notes are the CHANGELOG.md section for the project version. A
      # dry run before that section exists falls back to [Unreleased].
      - name: Extract release notes from CHANGELOG.md
        run: |
          section="$PROJECT_VERSION"
          if [ "$IS_RELEASE" != "true" ] && ! grep -qF "## [$section]" CHANGELOG.md; then section="Unreleased"; fi
          awk -v s="$section" '
            index($0, "## [" s "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entries under [$section]"
            exit 1
          fi
          cat release-notes.md

      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true

      # The docs site's download page links to the latest release's files, so
      # rebuild it now that this release exists. A release published with the
      # workflow token does not trigger other workflows; a dispatch does, and
      # it runs on the default branch, which the github-pages environment
      # requires for deploys.
      - name: Rebuild docs site
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f release_tag="$GITHUB_REF_NAME"
